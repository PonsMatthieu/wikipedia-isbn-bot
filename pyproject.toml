[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wikipedia-isbn-bot"
version = "0.1.0"
description = "Surveillance et vérification bibliographique des ISBN invalides sur Wikipédia"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32.3,<3",
  "mwparserfromhell>=0.7.2,<0.8",
  "defusedxml==0.7.1",
  "python-dotenv>=1.2.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
isbn-bot = "isbn_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

